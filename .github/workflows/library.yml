name: Library

# Builds libgitlfs as a C-compatible static archive for each supported platform.
#
# This workflow is intentionally self-contained and additive: it does not modify
# or depend on ci.yml or release.yml, so those files can be fast-forwarded from
# upstream without conflicts. See libgitlfs/README.md.
on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Each platform is independent; a failure on one must not cancel the
      # others, otherwise a single break hides the state of every other target.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'

    # cgo needs a gcc-compatible toolchain. The Git for Windows SDK provides
    # MinGW; MSVC cannot drive cgo.
    - uses: git-for-windows/setup-git-for-windows-sdk@v2
      if: runner.os == 'Windows'

    - name: Build static archive
      shell: bash
      run: |
        set -eu
        # Derive the label from the toolchain rather than from the runner
        # label, so an artifact can never claim an architecture it isn't.
        GOOS="$(go env GOOS)"
        GOARCH="$(go env GOARCH)"
        case "$GOOS" in
          windows) EXT=lib ;;
          *)       EXT=a   ;;
        esac
        NAME="libgitlfs-${GOOS}-${GOARCH}"
        mkdir -p dist
        CGO_ENABLED=1 go build -buildmode=c-archive -tags libgitlfs \
          -o "dist/${NAME}.${EXT}" ./libgitlfs
        cp libgitlfs/libgitlfs.h dist/
        ls -l dist

    - name: Verify archive
      shell: bash
      run: |
        set -eu
        cd dist
        archive="$(ls *.a *.lib 2>/dev/null | head -n1)"
        # A c-archive must be a real ar archive...
        head -c 8 "$archive" | grep -q '^!<arch>' \
          || { echo "::error::$archive is not an ar archive"; exit 1; }
        # ...and must actually export the entry points.
        for sym in GitLFS_Lock GitLFS_Unlock GitLFS_Locks \
                   GitLFS_FreeLocks GitLFS_FreeError; do
          grep -q "$sym" "$archive" \
            || { echo "::error::$archive is missing symbol $sym"; exit 1; }
        done
        echo "$archive: ar archive with all exported symbols present"

    - uses: actions/upload-artifact@v7
      with:
        name: libgitlfs-${{ matrix.os }}
        path: dist
